<head>

    <script type="module">
        const form = document.querySelector('#add')
        //const itemTemplate = document.querySelector("#itemTemplate") 

        function createElemntItem(elIndex, elTitle) {
            const clone = itemTemplate.content.cloneNode(true)
            const title = clone.querySelector('span')
            const delButton = clone.querySelector('button')
            console.log(title)
            title.innerText = elTitle
            title.dataset.id = elIndex // abre brecha pra um HACKER danado!
            itemTemplate.parentElement.append()
        }

        createElemntItem()

        void async function () {
            const response = await fetch("/todo")
            const items = await response.json()
            items.forEach(( item, index) => createElemntItem(index, items.title));
            console.log(items)
        }();

        form.addEventListener("submit", async (ev) => {
            ev.preventDefault()
            form.fieldset.setAttribute("disabled", true)
            const title = form.title.value 
            if (!title.trim() === '' ) 
                return

            const response = await fetch("/todo", {
                method: "POST",
                headers: { "content-type": "aplication/json"},
                body: JSON.stringify({title})
            })
            const item = await response.JSON
            console.log(item)
            createElemntItem(-1, title)
            form.title.value = ""
            
            
        })
    </script>
